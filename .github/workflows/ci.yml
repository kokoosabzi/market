name: CI

on:
  push:
    branches:
      - main
      - feature/phase-1-electron-sqlite
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Database tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit dependency vulnerabilities
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const v=a.metadata?.vulnerabilities||{}; console.log(JSON.stringify({metadata:v, vulnerabilities:Object.entries(a.vulnerabilities||{}).map(([name,x])=>({name,severity:x.severity,via:x.via.map(y=>typeof y==="string"?y:y.title),fixAvailable:x.fixAvailable}))},null,2)); if ((v.high||0)>0 || (v.critical||0)>0) process.exit(1)'
      - name: Run database and migration tests
        run: npm test
