name: CI

concurrency:
  group: market-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Windows tests and installer
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Upload npm lockfile used by CI for review
        uses: actions/upload-artifact@v4
        with:
          name: market-package-lock-windows
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Audit dependency vulnerabilities
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const v=a.metadata?.vulnerabilities||{}; console.log(JSON.stringify({metadata:v, vulnerabilities:Object.entries(a.vulnerabilities||{}).map(([name,x])=>({name,severity:x.severity,via:x.via.map(y=>typeof y==="string"?y:y.title),fixAvailable:x.fixAvailable}))},null,2)); if ((v.high||0)>0 || (v.critical||0)>0) process.exit(1)'
      - name: Run database and migration tests
        run: npm test
      - name: Rebuild native SQLite module for Electron
        run: npm run rebuild:native
      - name: Smoke-test Electron, renderer IPC, and SQLite
        run: npm run smoke:electron
      - name: Build synthetic previous-version installer for upgrade test
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packagePath = Join-Path $PWD 'package.json'
          try {
            node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("package.json","utf8")); p.version="0.0.9"; fs.writeFileSync("package.json", JSON.stringify(p,null,2)+"\n")'
            if ($LASTEXITCODE -ne 0) { throw 'Could not prepare synthetic previous-version package metadata' }
            Remove-Item -LiteralPath 'release' -Recurse -Force -ErrorAction SilentlyContinue
            npm run dist:win
            if ($LASTEXITCODE -ne 0) { throw 'Building the synthetic previous-version installer failed' }
            $previous = Get-ChildItem -Path 'release' -Filter '*.exe' | Where-Object { $_.Name -match 'Setup' } | Select-Object -First 1
            if (-not $previous) { throw 'Synthetic previous-version installer was not generated' }
            Copy-Item -LiteralPath $previous.FullName -Destination (Join-Path $env:RUNNER_TEMP 'market-previous-setup.exe') -Force
          }
          finally {
            git checkout -- package.json
            Remove-Item -LiteralPath 'release' -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Upload Windows installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: market-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Set up Python for installer persistence test
        if: runner.os == 'Windows'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and smoke-test packaged Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/installer-smoke.ps1

