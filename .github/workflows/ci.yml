name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Database tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Upload generated npm lockfile for review
        uses: actions/upload-artifact@v4
        with:
          name: market-package-lock-${{ matrix.os }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify lockfile with a clean npm ci install
        run: npm ci
      - name: Audit dependency vulnerabilities
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); const v=a.metadata?.vulnerabilities||{}; console.log(JSON.stringify({metadata:v, vulnerabilities:Object.entries(a.vulnerabilities||{}).map(([name,x])=>({name,severity:x.severity,via:x.via.map(y=>typeof y==="string"?y:y.title),fixAvailable:x.fixAvailable}))},null,2)); if ((v.high||0)>0 || (v.critical||0)>0) process.exit(1)'
      - name: Run database and migration tests
        run: npm test
      - name: Rebuild native SQLite module for Electron
        run: npm run rebuild:native
      - name: Smoke-test Electron, renderer IPC, and SQLite
        run: npm run smoke:electron
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npm run dist:win
      - name: Upload Windows installer artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: market-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

  commit-lockfile:
    name: Commit generated lockfile
    needs: test
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.ref == 'feature/phase-1-electron-sqlite' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Download generated lockfile
        uses: actions/download-artifact@v4
        with:
          name: market-package-lock-ubuntu-latest
          path: lockfile
      - name: Add lockfile if it is missing
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json already exists; no commit required."
            exit 0
          fi
          test -s lockfile/package-lock.json
          cp lockfile/package-lock.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add npm dependency lockfile"
          git push origin "HEAD:${TARGET_BRANCH}"
