name: CI

on:
  push:
    branches:
      - main
      - feature/phase-1-electron-sqlite
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Database tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit dependency vulnerabilities
        shell: bash
        run: |
          npm audit --json > npm-audit.json || true
          node -e 'const a=require("./npm-audit.json"); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, vulnerabilities:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,via:v.via.map(x=>typeof x==="string"?x:x.title),fixAvailable:v.fixAvailable}))},null,2))'
      - name: Run database and migration tests
        run: npm test
